# Local-dev orchestration. Start with:  docker compose up gateway research-mcp-bundle
#
# After M2 the ecommerce-mcp-bundle service will be added here.
# Goose machines are NEVER run via this compose file — they're spawned by the
# web app (locally as docker containers via the orchestrator's LOCAL_GOOSE
# code path; on Fly via the Machines API).

services:
  research-mcp-bundle:
    build:
      context: .
      dockerfile: apps/research-mcp-bundle/Dockerfile
    container_name: research-mcp-bundle
    volumes:
      - research-data:/data
    expose:
      - "8001"
      - "8002"
      - "8003"
      - "8004"
      - "8005"
    # Only expose ports for direct debugging; the gateway is the public surface.
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
      - "127.0.0.1:8003:8003"
      - "127.0.0.1:8004:8004"
      - "127.0.0.1:8005:8005"

  ecommerce-mcp-bundle:
    build:
      context: .
      dockerfile: apps/ecommerce-mcp-bundle/Dockerfile
    container_name: ecommerce-mcp-bundle
    volumes:
      - ecommerce-data:/data
    expose:
      - "8001"
      - "8002"
      - "8003"
      - "8004"
      - "8005"
    # Different host port mapping than the research bundle to avoid clashes.
    ports:
      - "127.0.0.1:9001:8001"
      - "127.0.0.1:9002:8002"
      - "127.0.0.1:9003:8003"
      - "127.0.0.1:9004:8004"
      - "127.0.0.1:9005:8005"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: gateway
    environment:
      RESEARCH_MCP_HOST: research-mcp-bundle
      ECOMMERCE_MCP_HOST: ecommerce-mcp-bundle
      ADMIN_ADDR: 0.0.0.0:15000
      RUST_LOG: info
    volumes:
      # Live registry — written by the web app's /registry editor, read by
      # the gateway on a 10s refresh interval. Seeded by entrypoint.sh on
      # first boot when the host dir is empty.
      - ./apps/web/data/gateway:/var/registry
    ports:
      - "3000:3000"
      - "15000:15000"  # gateway admin UI: http://localhost:15000/ui
    depends_on:
      - research-mcp-bundle
      - ecommerce-mcp-bundle

  # M3: a goose-runner brought up alongside compose for local validation.
  # In production this image is NOT compose-managed — the web app spawns it
  # per chat session via the Fly Machines API. Bring it up explicitly:
  #   docker compose --profile goose up
  goose-runner:
    build:
      context: .
      dockerfile: apps/goose-runner/Dockerfile
    container_name: goose-runner
    profiles: ["goose"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOSE_PROVIDER: anthropic
      GOOSE_MODEL: claude-sonnet-4-6
      GOOSE_RECIPE: research
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - gateway

networks:
  default:
    name: gloop

volumes:
  research-data:
  ecommerce-data:
