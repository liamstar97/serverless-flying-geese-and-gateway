[supervisord]
nodaemon=true
loglevel=info
logfile=/dev/null
logfile_maxbytes=0

[program:catalog]
command=/app/.venv/bin/python -m mcp_tools.catalog_service.server
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cart]
command=/app/.venv/bin/python -m mcp_tools.cart_service.server
