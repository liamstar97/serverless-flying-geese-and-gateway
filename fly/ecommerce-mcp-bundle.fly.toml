# Ecommerce MCP services bundled into one app. Same shape as research.

app = "gloop-liam-ecommerce-mcp"
primary_region = "sea"

[build]
  dockerfile = "apps/ecommerce-mcp-bundle/Dockerfile"

[[mounts]]
  source = "ecommerce_data"
  destination = "/data"
  initial_size = "1gb"

[[services]]
  internal_port = 8001
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  internal_port = 8002
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  internal_port = 8003
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  internal_port = 8004
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  internal_port = 8005
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
