# goose-runner. This app is the *source* for ephemeral machines spawned
# by the web app's orchestrator via the Fly Machines API. We never run
# any goose-runner instances directly under this fly.toml — `min_machines
# _running = 0` and the web app creates Machines on demand with the same
# image.
#
# The image is published once via `fly deploy --build-only` and referenced
# by digest when spawning machines.

app = "gloop-liam-goose-runner"
primary_region = "lax"

[build]
  dockerfile = "../apps/goose-runner/Dockerfile"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  # Per-machine wrapper — auto-stop is irrelevant because the orchestrator
  # explicitly destroys idle machines. Keep auto-start off so a stray
  # request doesn't accidentally boot one outside the orchestrator's
  # tracking.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
