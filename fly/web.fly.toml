# Next.js front door. Owns the Machines API orchestrator + auth.

app = "gloop-liam-web"
primary_region = "lax"

[build]
  dockerfile = "../apps/web/Dockerfile"

# Bind-mount the same registry volume as the gateway so /registry writes
# go to one truth. Local sessions.db + persona files also live here so
# they survive deploys — the web app is single-instance, single-region.
[[mounts]]
  source = "web_data"
  destination = "/data"
  initial_size = "1gb"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  GLOOP_DATA_DIR = "/data"
  LOCAL_GOOSE = "0"  # use Fly Machines API, not docker run
  GATEWAY_URL = "http://gloop-liam-gateway.internal:3000"
  GATEWAY_INTERNAL_URL = "http://gloop-liam-gateway.internal:3000"
  GATEWAY_ADMIN_URL = "http://gloop-liam-gateway.internal:15000/ui"
  FLY_GATEWAY_APP = "gloop-liam-gateway"
  FLY_RESEARCH_APP = "gloop-liam-research-mcp"
  FLY_ECOMMERCE_APP = "gloop-liam-ecommerce-mcp"
  FLY_GOOSE_APP = "gloop-liam-goose-runner"
  FLY_GOOSE_REGION = "lax"

[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # keep one warm so first sign-in is fast

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  [[services.http_checks]]
    interval = "15s"
    method = "get"
    path = "/api/auth/providers"
    protocol = "http"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
